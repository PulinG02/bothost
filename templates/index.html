<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NpcHosting — Python & Telegram Bot Hosting</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:         #050507;
    --bg2:        #0a0a0f;
    --bg3:        #0e0e16;
    --bg4:        #12121c;
    --border:     #1c1c2e;
    --border2:    #252538;
    --muted:      #3a3a5c;
    --sub:        #5c5c8a;
    --dim:        #7878aa;
    --text:       #a0a0cc;
    --bright:     #eeeef8;
    --blue:       #4f6ef7;
    --blue-glow:  rgba(79,110,247,.25);
    --indigo:     #7c5af7;
    --green:      #3dd68c;
    --green-glow: rgba(61,214,140,.2);
    --red:        #f75a5a;
    --amber:      #f7a93d;
    --purple:     #a855f7;
    --radius:     12px;
    --radius-sm:  8px;
    --header-h:   60px;
    --stats-h:    72px;
  }

  html, body { height:100%; background:var(--bg); color:var(--bright); font-family:'Inter',system-ui,sans-serif; font-size:14px; overflow:hidden; }
  ::-webkit-scrollbar { width:4px; height:4px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:var(--border2); border-radius:4px; }

  /* ── App shell ── */
  #app { display:flex; flex-direction:column; height:100vh; }

  /* ── Header ── */
  #header {
    background: linear-gradient(90deg, var(--bg2), #0d0d18);
    border-bottom: 1px solid var(--border);
    height: var(--header-h);
    padding: 0 20px;
    display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0;
    position: relative; z-index: 10;
  }
  #header::after {
    content:''; position:absolute; bottom:0; left:0; right:0; height:1px;
    background: linear-gradient(90deg, transparent, var(--blue), var(--indigo), transparent);
    opacity:.5;
  }
  .logo { display:flex; align-items:center; gap:10px; }
  .logo-icon {
    width:34px; height:34px;
    background: linear-gradient(135deg, var(--blue), var(--indigo));
    border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    font-size:17px;
    box-shadow: 0 0 20px var(--blue-glow);
  }
  .logo-name { font-weight:800; font-size:15px; letter-spacing:-.03em; }
  .logo-sub  { font-size:10px; color:var(--sub); }
  .header-right { display:flex; align-items:center; gap:10px; }
  .running-pill {
    background:var(--bg3); border:1px solid var(--border2);
    border-radius:20px; padding:5px 12px;
    font-size:11px; color:var(--sub);
  }
  .running-pill span { color:var(--green); font-weight:700; }

  /* ── Stats bar ── */
  #stats-bar {
    background:var(--bg2);
    border-bottom:1px solid var(--border);
    display:flex; flex-shrink:0;
    height:var(--stats-h);
  }
  .stat-item {
    flex:1; padding:10px 16px;
    border-right:1px solid var(--border);
    position:relative; overflow:hidden;
  }
  .stat-item:last-child { border-right:none; }
  .stat-item::before {
    content:''; position:absolute; top:0; left:0; right:0;
    height:2px; border-radius:2px; opacity:0; transition:opacity .3s;
  }
  .stat-item:hover::before { opacity:1; }
  .stat-item:nth-child(1)::before { background:linear-gradient(90deg,var(--blue),var(--indigo)); }
  .stat-item:nth-child(2)::before { background:linear-gradient(90deg,var(--green),#2abb7a); }
  .stat-item:nth-child(3)::before { background:linear-gradient(90deg,var(--muted),var(--sub)); }
  .stat-item:nth-child(4)::before { background:linear-gradient(90deg,var(--purple),var(--indigo)); }
  .stat-label { font-size:9px; color:var(--sub); text-transform:uppercase; letter-spacing:.08em; margin-bottom:4px; font-weight:700; }
  .stat-value { font-size:22px; font-weight:800; letter-spacing:-.04em; }
  .stat-green  { color:var(--green); }
  .stat-gray   { color:var(--muted); }
  .stat-purple { color:var(--purple); }

  /* ── Main area ── */
  #main {
    flex:1; display:flex; overflow:hidden;
    position:relative;
  }

  /* ── SIDEBAR (Bot List View) ── */
  #sidebar {
    width:300px; flex-shrink:0;
    border-right:1px solid var(--border);
    background:var(--bg2);
    display:flex; flex-direction:column;
    overflow:hidden;
    transition:transform .3s cubic-bezier(.4,0,.2,1);
  }
  .sidebar-header {
    padding:14px 18px 10px;
    border-bottom:1px solid var(--border);
    font-size:10px; color:var(--muted);
    text-transform:uppercase; letter-spacing:.1em; font-weight:700;
    flex-shrink:0;
  }
  #bot-list { flex:1; overflow-y:auto; }

  .bot-item {
    padding:14px 18px;
    border-bottom:1px solid var(--border);
    cursor:pointer;
    border-left:3px solid transparent;
    transition:background .15s, border-color .2s;
    position:relative;
  }
  .bot-item:hover { background:var(--bg3); }
  .bot-item.active { background:var(--bg3); border-left-color:var(--blue); }
  .bot-item-top { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px; }
  .bot-name { font-weight:700; font-size:13px; color:var(--bright); margin-bottom:2px; }
  .bot-file { font-size:10px; color:var(--muted); font-family:'JetBrains Mono',monospace; }
  .bot-metrics { display:flex; gap:14px; margin-top:6px; }
  .metric-mini-label { font-size:9px; color:var(--muted); margin-bottom:3px; text-transform:uppercase; letter-spacing:.05em; }
  .metric-mini-row { display:flex; align-items:center; gap:6px; }
  .metric-mini-val { font-size:10px; color:var(--dim); font-family:'JetBrains Mono',monospace; }
  .mini-bar-track { width:60px; height:4px; background:var(--border); border-radius:3px; overflow:hidden; }
  .mini-bar-fill { height:100%; border-radius:3px; transition:width .4s; }

  .sidebar-empty {
    padding:40px 20px; text-align:center;
    color:var(--muted); font-size:13px; line-height:1.7;
  }
  .sidebar-empty .empty-icon { font-size:36px; margin-bottom:12px; display:block; }

  /* ── DETAIL (Bot Detail View) ── */
  #detail {
    flex:1; overflow-y:auto; padding:24px;
    background:var(--bg);
    transition:transform .3s cubic-bezier(.4,0,.2,1);
  }

  /* ── MOBILE: two-panel slide ── */
  @media(max-width:768px) {
    #sidebar {
      position:absolute; top:0; left:0; bottom:0;
      width:100%; z-index:5;
      transform:translateX(0);
    }
    #sidebar.slide-out {
      transform:translateX(-100%);
      pointer-events:none;
    }
    #detail {
      position:absolute; top:0; left:0; right:0; bottom:0;
      z-index:4;
      transform:translateX(100%);
      padding:16px;
    }
    #detail.slide-in {
      transform:translateX(0);
    }
    #stats-bar .stat-label { font-size:8px; }
    #stats-bar .stat-value { font-size:18px; }
    .stat-item { padding:8px 10px; }
    .cards-grid { grid-template-columns:1fr 1fr !important; }
  }

  /* Back button (mobile only) */
  #back-btn {
    display:none;
    align-items:center; gap:8px;
    background:var(--bg3); border:1px solid var(--border2);
    border-radius:var(--radius-sm);
    color:var(--text); font-size:13px; font-weight:600;
    padding:8px 14px; cursor:pointer;
    margin-bottom:20px;
    font-family:inherit;
    transition:all .15s;
  }
  #back-btn:hover { border-color:var(--blue); color:var(--blue); }
  @media(max-width:768px) {
    #back-btn { display:flex; }
  }

  /* ── Empty state ── */
  .empty-state {
    height:100%; display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:14px; text-align:center;
  }
  .empty-icon-wrap {
    width:80px; height:80px;
    background:linear-gradient(135deg,var(--bg3),var(--bg4));
    border:1px solid var(--border2); border-radius:24px;
    display:flex; align-items:center; justify-content:center;
    font-size:36px;
    box-shadow:0 0 40px rgba(79,110,247,.1);
  }
  .empty-title { font-size:16px; font-weight:700; color:var(--text); }
  .empty-sub   { font-size:13px; color:var(--muted); }

  /* ── Detail content ── */
  .detail-header {
    display:flex; justify-content:space-between; align-items:flex-start;
    margin-bottom:24px; flex-wrap:wrap; gap:12px;
    padding-bottom:18px; border-bottom:1px solid var(--border);
  }
  .detail-title-row { display:flex; align-items:center; gap:10px; margin-bottom:5px; flex-wrap:wrap; }
  .detail-title { font-size:20px; font-weight:800; letter-spacing:-.04em; }
  .detail-meta  { font-size:12px; color:var(--sub); display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .detail-actions { display:flex; gap:8px; flex-wrap:wrap; }

  .cards-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:22px; }
  .card {
    background:var(--bg2); border:1px solid var(--border2);
    border-radius:var(--radius); padding:16px 18px;
    position:relative; overflow:hidden; transition:border-color .2s;
  }
  .card:hover { border-color:var(--muted); }
  .card::before { content:''; position:absolute; top:0; left:0; right:0; height:1px; }
  .card:nth-child(1)::before { background:linear-gradient(90deg,transparent,var(--blue),transparent); }
  .card:nth-child(2)::before { background:linear-gradient(90deg,transparent,var(--purple),transparent); }
  .card:nth-child(3)::before { background:linear-gradient(90deg,transparent,var(--green),transparent); }
  .card-label { font-size:10px; color:var(--sub); text-transform:uppercase; letter-spacing:.08em; margin-bottom:8px; font-weight:700; }
  .card-value { font-size:26px; font-weight:800; letter-spacing:-.04em; margin-bottom:10px; }
  .card-bar { height:3px; background:var(--border); border-radius:2px; overflow:hidden; }
  .card-bar-fill { height:100%; border-radius:2px; transition:width .5s cubic-bezier(.4,0,.2,1); }

  .token-box {
    background:var(--bg2); border:1px solid var(--border2);
    border-radius:var(--radius); padding:14px 18px;
    margin-bottom:20px;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  .token-label { font-size:10px; color:var(--sub); text-transform:uppercase; letter-spacing:.08em; font-weight:700; margin-bottom:4px; }
  .token-val { font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--text); word-break:break-all; }
  .token-badge { flex-shrink:0; font-size:10px; color:var(--muted); background:var(--border); padding:4px 10px; border-radius:20px; font-weight:600; text-transform:uppercase; }

  .section-label {
    font-size:10px; color:var(--sub); text-transform:uppercase; letter-spacing:.1em; font-weight:700;
    margin-bottom:10px; display:flex; align-items:center; gap:8px;
  }
  .section-label::after { content:''; flex:1; height:1px; background:linear-gradient(90deg,var(--border),transparent); }

  .log-box {
    background:var(--bg2); border:1px solid var(--border2); border-radius:var(--radius);
    padding:12px 14px; font-family:'JetBrains Mono',monospace;
    font-size:11px; color:var(--dim); max-height:260px; overflow-y:auto; line-height:1.9;
  }
  .log-empty { color:var(--muted); }
  .log-ok    { color:var(--green); }
  .log-warn  { color:var(--amber); }
  .log-err, .log-ERR { color:var(--red); }
  .log-stop  { color:var(--red); }
  .log-count { font-size:10px; color:var(--muted); margin-top:6px; text-align:right; font-family:'JetBrains Mono',monospace; }

  /* ── Badge ── */
  .badge {
    display:inline-flex; align-items:center; gap:5px;
    font-size:10px; font-weight:700; padding:4px 10px;
    border-radius:20px; letter-spacing:.06em; text-transform:uppercase;
  }
  .badge-running { background:rgba(61,214,140,.1); color:var(--green); border:1px solid rgba(61,214,140,.2); }
  .badge-stopped { background:var(--bg3); color:var(--muted); border:1px solid var(--border2); }
  .badge-error   { background:rgba(247,90,90,.1); color:var(--red); border:1px solid rgba(247,90,90,.2); }
  .badge-dot { width:5px; height:5px; border-radius:50%; }
  .badge-running .badge-dot { background:var(--green); box-shadow:0 0 6px var(--green); animation:pulse 2s infinite; }
  .badge-stopped .badge-dot { background:var(--muted); }
  .badge-error   .badge-dot { background:var(--red); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }

  /* ── Buttons ── */
  .btn {
    border:none; border-radius:var(--radius-sm);
    padding:8px 16px; font-size:12px; font-weight:600;
    cursor:pointer; display:inline-flex; align-items:center; gap:6px;
    transition:all .18s; font-family:inherit; letter-spacing:.01em;
  }
  .btn:hover { transform:translateY(-1px); }
  .btn:active { transform:translateY(0); }
  .btn:disabled { opacity:.4; cursor:not-allowed; transform:none; }
  .btn-primary { background:linear-gradient(135deg,var(--blue),var(--indigo)); color:#fff; box-shadow:0 4px 16px var(--blue-glow); }
  .btn-primary:hover { box-shadow:0 6px 24px rgba(79,110,247,.4); }
  .btn-stop  { background:#1a0f1f; color:var(--red);   border:1px solid #3a1a2a; }
  .btn-start { background:#0a1f14; color:var(--green); border:1px solid #0d3320; }
  .btn-warn  { background:#1f1508; color:var(--amber); border:1px solid #3a2a08; }
  .btn-dl    { background:#0a1220; color:var(--blue);  border:1px solid #1a2a50; }
  .btn-dl:hover { background:#0d1830; border-color:var(--blue); }
  .btn-ghost { background:var(--bg3); color:var(--dim); border:1px solid var(--border2); }
  .btn-ghost:hover { color:var(--text); border-color:var(--muted); }

  /* ── Modal ── */
  #modal-overlay {
    display:none; position:fixed; inset:0;
    background:rgba(0,0,0,.85); z-index:200;
    align-items:center; justify-content:center;
    backdrop-filter:blur(8px);
  }
  #modal-overlay.open { display:flex; }
  .modal {
    background:var(--bg3); border:1px solid var(--border2);
    border-radius:16px; padding:28px;
    width:min(460px, calc(100vw - 32px));
    box-shadow:0 32px 80px rgba(0,0,0,.8), 0 0 0 1px rgba(79,110,247,.1);
    position:relative; overflow:hidden;
  }
  .modal::before {
    content:''; position:absolute; top:0; left:0; right:0; height:1px;
    background:linear-gradient(90deg,transparent,var(--blue),var(--indigo),transparent);
  }
  .modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:22px; }
  .modal-title  { color:var(--bright); font-weight:800; font-size:16px; letter-spacing:-.02em; }
  .modal-close  {
    background:var(--bg4); border:1px solid var(--border2);
    color:var(--dim); font-size:15px; cursor:pointer;
    width:28px; height:28px; border-radius:6px;
    display:flex; align-items:center; justify-content:center; transition:all .15s;
  }
  .modal-close:hover { color:var(--bright); border-color:var(--muted); }
  .field { margin-bottom:16px; }
  .field label { display:block; font-size:11px; color:var(--text); text-transform:uppercase; letter-spacing:.07em; font-weight:700; margin-bottom:6px; }
  .field input {
    display:block; width:100%; background:var(--bg4); border:1px solid var(--border2);
    border-radius:var(--radius-sm); padding:10px 12px;
    color:var(--bright); font-size:14px; outline:none; font-family:inherit;
    transition:border-color .15s, box-shadow .15s;
  }
  .field input:focus { border-color:var(--blue); box-shadow:0 0 0 3px rgba(79,110,247,.1); }
  .field input.mono { font-family:'JetBrains Mono',monospace; font-size:12px; }
  #drop-zone {
    border:2px dashed var(--border2); border-radius:var(--radius-sm);
    padding:22px; text-align:center; cursor:pointer;
    color:var(--sub); font-size:13px; transition:all .2s;
    margin-bottom:18px; background:var(--bg4);
  }
  #drop-zone:hover, #drop-zone.drag { border-color:var(--blue); background:rgba(79,110,247,.05); color:var(--blue); }
  #drop-zone.has-file { border-color:var(--green); color:var(--green); background:rgba(61,214,140,.05); }

  /* ── Toast ── */
  #toast { position:fixed; top:16px; right:16px; z-index:999; pointer-events:none; }
  .toast-item {
    background:linear-gradient(135deg,#0a1f14,#0d2a1a); border:1px solid rgba(61,214,140,.2);
    color:var(--green); padding:10px 16px; border-radius:10px;
    font-size:13px; font-weight:600; box-shadow:0 8px 24px rgba(0,0,0,.5);
    animation:slideIn .25s ease; margin-bottom:8px;
  }
  .toast-item.warn  { background:linear-gradient(135deg,#1f1508,#2a1c08); border-color:rgba(247,169,61,.2); color:var(--amber); }
  .toast-item.error { background:linear-gradient(135deg,#1f0808,#2a0f0f); border-color:rgba(247,90,90,.2); color:var(--red); }
  @keyframes slideIn { from{transform:translateY(-16px);opacity:0} to{transform:translateY(0);opacity:1} }

  /* ── Confirm ── */
  #confirm-overlay {
    display:none; position:fixed; inset:0;
    background:rgba(0,0,0,.75); z-index:300;
    align-items:center; justify-content:center; backdrop-filter:blur(6px);
  }
  #confirm-overlay.open { display:flex; }
  .confirm-box {
    background:var(--bg3); border:1px solid var(--border2);
    border-radius:14px; padding:28px; width:320px; text-align:center;
    box-shadow:0 24px 60px rgba(0,0,0,.7);
  }
  .confirm-icon  { font-size:36px; margin-bottom:10px; }
  .confirm-title { font-size:16px; font-weight:800; margin-bottom:8px; }
  .confirm-sub   { font-size:13px; color:var(--text); margin-bottom:20px; line-height:1.6; }
  .confirm-actions { display:flex; gap:10px; justify-content:center; }
</style>
</head>
<body>
<div id="app">

  <!-- Header -->
  <div id="header">
    <div class="logo">
      <div class="logo-icon">🤖</div>
      <div>
        <div class="logo-name">NpcHosting</div>
        <div class="logo-sub">Python &amp; Telegram Bot Hosting</div>
      </div>
    </div>
    <div class="header-right">
      <div class="running-pill"><span id="hdr-running">0</span>/<span id="hdr-total">0</span> running</div>
      <button class="btn btn-primary" onclick="openModal()">＋ Deploy Bot</button>
    </div>
  </div>

  <!-- Stats bar -->
  <div id="stats-bar">
    <div class="stat-item"><div class="stat-label">🤖 Total Bots</div><div class="stat-value" id="s-total">0</div></div>
    <div class="stat-item"><div class="stat-label">🟢 Running</div><div class="stat-value stat-green" id="s-running">0</div></div>
    <div class="stat-item"><div class="stat-label">⚫ Stopped</div><div class="stat-value stat-gray" id="s-stopped">0</div></div>
    <div class="stat-item"><div class="stat-label">💾 RAM</div><div class="stat-value stat-purple" id="s-ram">0 MB</div></div>
  </div>

  <!-- Main: sidebar + detail as two sliding panels -->
  <div id="main">

    <!-- Panel 1: Bot List -->
    <div id="sidebar">
      <div class="sidebar-header">Your Bots</div>
      <div id="bot-list"></div>
    </div>

    <!-- Panel 2: Bot Detail -->
    <div id="detail">
      <!-- Back button (mobile) -->
      <button id="back-btn" onclick="goBack()">← Back to Bots</button>

      <div class="empty-state" id="empty-state">
        <div class="empty-icon-wrap">🤖</div>
        <div class="empty-title">Select a bot</div>
        <div class="empty-sub">Tap a bot from the list to view details</div>
        <button class="btn btn-primary" style="margin-top:4px" onclick="openModal()">＋ Deploy your first bot</button>
      </div>
      <div id="bot-detail" style="display:none"></div>
    </div>
  </div>
</div>

<!-- Deploy Modal -->
<div id="modal-overlay" onclick="closeModalIfBg(event)">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">Deploy New Bot</span>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="field"><label>Bot Name</label><input type="text" id="f-name" placeholder="MyAwesomeBot"/></div>
    <div class="field"><label>Telegram Bot Token</label><input type="text" id="f-token" class="mono" placeholder="1234567890:AAExampleToken"/></div>
    <div class="field"><label>Python File (.py)</label></div>
    <div id="drop-zone" onclick="document.getElementById('f-file').click()" ondragover="doDragOver(event)" ondragleave="doDragLeave()" ondrop="doDrop(event)">
      📂 Drag &amp; drop .py file or click to browse
      <input type="file" id="f-file" accept=".py" style="display:none" onchange="onFileSelect(event)"/>
    </div>
    <button class="btn btn-primary" style="width:100%;justify-content:center;padding:12px;font-size:14px" id="deploy-btn" onclick="deployBot()">🚀 Deploy Bot</button>
  </div>
</div>

<!-- Confirm Delete -->
<div id="confirm-overlay">
  <div class="confirm-box">
    <div class="confirm-icon">🗑️</div>
    <div class="confirm-title">Delete Bot?</div>
    <div class="confirm-sub" id="confirm-msg">Are you sure?</div>
    <div class="confirm-actions">
      <button class="btn btn-ghost" onclick="closeConfirm()">Cancel</button>
      <button class="btn" style="background:rgba(247,90,90,.15);color:var(--red);border:1px solid rgba(247,90,90,.25)" id="confirm-ok">Delete</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const API = "";
let bots = [], selectedId = null, selectedFile = null, pendingDeleteId = null;
let logSince = {}, pollInterval = null, logInterval = null;
const isMobile = () => window.innerWidth <= 768;

/* ── Navigation (mobile two-panel) ── */
function showDetail() {
  if (!isMobile()) return;
  document.getElementById("sidebar").classList.add("slide-out");
  document.getElementById("detail").classList.add("slide-in");
}
function goBack() {
  if (!isMobile()) return;
  document.getElementById("sidebar").classList.remove("slide-out");
  document.getElementById("detail").classList.remove("slide-in");
  selectedId = null;
  render();
}
window.addEventListener("resize", () => {
  if (!isMobile()) {
    document.getElementById("sidebar").classList.remove("slide-out");
    document.getElementById("detail").classList.remove("slide-in");
  }
});

/* ── API ── */
async function apiFetch(path, options = {}) {
  try {
    const res = await fetch(API + path, options);
    if (!res.ok) { const err = await res.json().catch(()=>({})); throw new Error(err.detail || res.statusText); }
    return await res.json();
  } catch(e) { toast("API error: " + e.message, "error"); throw e; }
}
async function loadBots() { try { bots = await apiFetch("/api/bots"); render(); } catch(_){} }
async function loadLogs(bot_id) {
  const since = logSince[bot_id] || 0;
  try {
    const data = await apiFetch(`/api/bots/${bot_id}/logs?since=${since}`);
    if (data.logs.length > 0) { logSince[bot_id] = data.total; appendLogsToUI(bot_id, data.logs); }
  } catch(_){}
}
function appendLogsToUI(bot_id, newLines) {
  if (selectedId !== bot_id) return;
  const box = document.getElementById("log-box"); if (!box) return;
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
  newLines.forEach(line => {
    const div = document.createElement("div");
    div.className = "log-" + classifyLog(line); div.textContent = line; box.appendChild(div);
  });
  const countEl = document.getElementById("log-count");
  if (countEl) countEl.textContent = (logSince[bot_id]||0) + " log entries";
  if (atBottom) box.scrollTop = box.scrollHeight;
}
function classifyLog(line) {
  if (line.includes("✅")||line.includes("▶")) return "ok";
  if (line.includes("⚠️")||line.includes("🔄")) return "warn";
  if (line.includes("❌")||line.includes("ERR:")) return "err";
  if (line.includes("🛑")) return "stop";
  return "";
}

/* ── Actions ── */
async function deployBot() {
  const name = document.getElementById("f-name").value.trim();
  const token = document.getElementById("f-token").value.trim();
  if (!name) { toast("Enter a bot name","error"); return; }
  if (!token) { toast("Enter the Telegram token","error"); return; }
  if (!selectedFile) { toast("Select a .py file","error"); return; }
  const btn = document.getElementById("deploy-btn");
  btn.disabled = true; btn.textContent = "Deploying...";
  const form = new FormData();
  form.append("name",name); form.append("token",token); form.append("file",selectedFile);
  try {
    const res = await fetch(API+"/api/bots/deploy",{method:"POST",body:form});
    if (!res.ok) { const e = await res.json(); throw new Error(e.detail||"Failed"); }
    const data = await res.json();
    toast(`${name} deployed! 🚀`); closeModal();
    await loadBots(); selectedId = data.id; logSince[data.id] = 0; render();
    if (isMobile()) showDetail();
  } catch(e) { toast("Deploy failed: "+e.message,"error");
  } finally { btn.disabled=false; btn.textContent="🚀 Deploy Bot"; }
}
async function toggleBot(id) {
  const bot = bots.find(b=>b.id===id); if (!bot) return;
  if (bot.status==="running") { await apiFetch(`/api/bots/${id}/stop`,{method:"POST"}); toast(`${bot.name} stopped`,"warn"); }
  else { await apiFetch(`/api/bots/${id}/start`,{method:"POST"}); toast(`${bot.name} started`); logSince[id]=logSince[id]||0; }
  await loadBots(); render();
}
async function restartBot(id) {
  const bot = bots.find(b=>b.id===id); if (!bot) return;
  await apiFetch(`/api/bots/${id}/restart`,{method:"POST"}); toast(`${bot.name} restarted`);
  await loadBots(); render();
}
function confirmDelete(id) {
  const bot = bots.find(b=>b.id===id); if (!bot) return;
  pendingDeleteId = id;
  document.getElementById("confirm-msg").textContent = `Delete "${bot.name}"? This cannot be undone.`;
  document.getElementById("confirm-ok").onclick = doDelete;
  document.getElementById("confirm-overlay").classList.add("open");
}
async function downloadBot(id, filename) {
  try {
    const res = await fetch(`${API}/api/bots/${id}/download`);
    if (!res.ok) { toast("Download failed", "error"); return; }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename || "bot.py";
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast("⬇ " + filename + " downloaded!");
  } catch(e) { toast("Download error: " + e.message, "error"); }
}
async function doDelete() {
  const bot = bots.find(b=>b.id===pendingDeleteId);
  try {
    await apiFetch(`/api/bots/${pendingDeleteId}`,{method:"DELETE"});
    if (selectedId===pendingDeleteId) { selectedId=null; if(isMobile()) goBack(); }
    toast(`${bot?.name||"Bot"} deleted`,"error"); closeConfirm();
    await loadBots(); render();
  } catch(_){}
}

/* ── Render ── */
function render() {
  const total=bots.length, running=bots.filter(b=>b.status==="running").length;
  const stopped=bots.filter(b=>b.status==="stopped").length;
  const ram=bots.reduce((a,b)=>a+(b.memory||0),0).toFixed(0);
  document.getElementById("s-total").textContent=total;
  document.getElementById("s-running").textContent=running;
  document.getElementById("s-stopped").textContent=stopped;
  document.getElementById("s-ram").textContent=ram+" MB";
  document.getElementById("hdr-running").textContent=running;
  document.getElementById("hdr-total").textContent=total;
  renderSidebar(); renderDetail();
}
function renderSidebar() {
  const list = document.getElementById("bot-list");
  if (bots.length===0) {
    list.innerHTML=`<div class="sidebar-empty"><span class="empty-icon">🤖</span>No bots yet.<br/>Click "Deploy Bot" to start.</div>`;
    return;
  }
  list.innerHTML = bots.map(b=>`
    <div class="bot-item ${selectedId===b.id?'active':''}" onclick="selectBot('${b.id}')">
      <div class="bot-item-top">
        <div><div class="bot-name">${esc(b.name)}</div><div class="bot-file">${esc(b.file)}</div></div>
        ${badge(b.status)}
      </div>
      ${b.status==="running"?`
      <div class="bot-metrics">
        <div class="metric-mini">
          <div class="metric-mini-label">CPU</div>
          <div class="metric-mini-row">
            <div class="mini-bar-track"><div class="mini-bar-fill" style="width:${Math.min((b.cpu||0)/15*100,100)}%;background:var(--blue)"></div></div>
            <span class="metric-mini-val">${(b.cpu||0).toFixed(1)}%</span>
          </div>
        </div>
        <div class="metric-mini">
          <div class="metric-mini-label">RAM</div>
          <div class="metric-mini-row">
            <div class="mini-bar-track"><div class="mini-bar-fill" style="width:${Math.min(b.memory||0,100)}%;background:var(--purple)"></div></div>
            <span class="metric-mini-val">${(b.memory||0).toFixed(0)}MB</span>
          </div>
        </div>
      </div>`:""}
    </div>
  `).join("");
}
function renderDetail() {
  const bot = bots.find(b=>b.id===selectedId);
  const emptyEl=document.getElementById("empty-state"), detailEl=document.getElementById("bot-detail");
  if (!bot) { emptyEl.style.display="flex"; detailEl.style.display="none"; return; }
  emptyEl.style.display="none"; detailEl.style.display="block";
  const isRunning = bot.status==="running";
  detailEl.innerHTML=`
    <div class="detail-header">
      <div>
        <div class="detail-title-row">
          <span class="detail-title">${esc(bot.name)}</span>
          ${badge(bot.status)}
        </div>
        <div class="detail-meta">
          <span>📄 ${esc(bot.file)}</span>
          <span style="color:var(--border2)">•</span>
          <span>🕐 ${esc(bot.uptime||"—")}</span>
        </div>
      </div>
      <div class="detail-actions">
        <button class="btn ${isRunning?'btn-stop':'btn-start'}" onclick="toggleBot('${bot.id}')">
          ${isRunning?'⏹ Stop':'▶ Start'}
        </button>
        <button class="btn btn-warn" onclick="restartBot('${bot.id}')">🔄 Restart</button>
        <button class="btn btn-dl" onclick="downloadBot('${bot.id}','${esc(bot.file)}')">⬇ Download</button>
        <button class="btn btn-ghost" onclick="confirmDelete('${bot.id}')">🗑 Delete</button>
      </div>
    </div>
    <div class="cards-grid">
      <div class="card">
        <div class="card-label">⚡ CPU Usage</div>
        <div class="card-value">${(bot.cpu||0).toFixed(1)}<span style="font-size:13px;color:var(--sub)">%</span></div>
        <div class="card-bar"><div class="card-bar-fill" style="width:${Math.min((bot.cpu||0)/15*100,100)}%;background:linear-gradient(90deg,var(--blue),var(--indigo))"></div></div>
      </div>
      <div class="card">
        <div class="card-label">💾 Memory</div>
        <div class="card-value">${(bot.memory||0).toFixed(0)}<span style="font-size:13px;color:var(--sub)"> MB</span></div>
        <div class="card-bar"><div class="card-bar-fill" style="width:${Math.min(bot.memory||0,100)}%;background:linear-gradient(90deg,var(--purple),var(--indigo))"></div></div>
      </div>
      <div class="card">
        <div class="card-label">📶 Status</div>
        <div class="card-value" style="color:${isRunning?'var(--green)':'var(--muted)'};font-size:20px">${isRunning?'Active':'Offline'}</div>
      </div>
    </div>
    <div class="token-box">
      <div style="flex:1;min-width:0">
        <div class="token-label">🔑 Telegram Token</div>
        <div class="token-val">${esc(bot.token||"—")}</div>
      </div>
      <span class="token-badge">masked</span>
    </div>
    <div class="section-label">📋 Live Logs</div>
    <div class="log-box" id="log-box"><div class="log-empty">Loading logs…</div></div>
    <div class="log-count" id="log-count">0 log entries</div>
  `;
  logSince[bot.id]=0;
  document.getElementById("log-box").innerHTML="";
  loadLogs(bot.id);
}
function selectBot(id) {
  selectedId=id; render();
  if (isMobile()) showDetail();
}

/* ── Polling ── */
function startPolling() {
  pollInterval=setInterval(async()=>{ await loadBots(); },3000);
  logInterval=setInterval(()=>{ if(selectedId) loadLogs(selectedId); },1500);
}

/* ── Modal ── */
function openModal() {
  document.getElementById("f-name").value="";
  document.getElementById("f-token").value="";
  document.getElementById("f-file").value="";
  selectedFile=null; resetDropZone();
  document.getElementById("modal-overlay").classList.add("open");
}
function closeModal() { document.getElementById("modal-overlay").classList.remove("open"); }
function closeModalIfBg(e) { if(e.target===document.getElementById("modal-overlay")) closeModal(); }
function closeConfirm() { pendingDeleteId=null; document.getElementById("confirm-overlay").classList.remove("open"); }
function doDragOver(e) { e.preventDefault(); document.getElementById("drop-zone").classList.add("drag"); }
function doDragLeave() { document.getElementById("drop-zone").classList.remove("drag"); }
function doDrop(e) {
  e.preventDefault(); doDragLeave();
  const f=e.dataTransfer.files[0];
  if(f&&f.name.endsWith(".py")) setFile(f); else toast("Please drop a .py file","error");
}
function onFileSelect(e) { if(e.target.files[0]) setFile(e.target.files[0]); }
function setFile(f) {
  selectedFile=f;
  const dz=document.getElementById("drop-zone");
  dz.classList.remove("drag"); dz.classList.add("has-file");
  dz.textContent="✅ "+f.name;
}
function resetDropZone() {
  const dz=document.getElementById("drop-zone");
  dz.classList.remove("drag","has-file");
  dz.innerHTML='📂 Drag &amp; drop .py file or click to browse<input type="file" id="f-file" accept=".py" style="display:none" onchange="onFileSelect(event)"/>';
}

/* ── Utils ── */
function badge(status) {
  const labels={running:"Running",stopped:"Stopped",error:"Error"};
  return `<span class="badge badge-${status}"><span class="badge-dot"></span>${labels[status]||status}</span>`;
}
function esc(s) { return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function toast(msg,type="success") {
  const c=document.getElementById("toast");
  const el=document.createElement("div");
  el.className="toast-item"+(type!=="success"?" "+type:"");
  el.textContent=msg; c.appendChild(el);
  setTimeout(()=>el.remove(),2800);
}

loadBots().then(()=>{ render(); startPolling(); });
</script>
</body>
</html>
